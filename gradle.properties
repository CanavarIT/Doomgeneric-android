#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Sat Sep 12 16:45:53 GMT 2026
org.gradle.caching=true
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
kotlin.incremental=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx512m -XX\:MaxMetaspaceSize\=256m -Dfile.encoding\=UTF-8 -Dsun.jnu.encoding\=UTF-8 -Duser.language\=en -Duser.country\=US
android.enableJetifier=false
android.useAndroidX=true
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.configureondemand=true
